<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.addEventListener('touchstart',function(){},{passive:true});</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="only light" />
  <meta name="supported-color-schemes" content="light" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ETM Checklist" />
  <title>Thrift at the Warehouse — Warehouse — ETM Checklist</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/app-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <section class="location-page">
      <a class="back-link" href="index.html">&larr; Back to Locations</a>

      <header class="loc-header">
        <p class="loc-eyebrow">Thrift at the Warehouse</p>
        <h1>Warehouse</h1>
      </header>

      <div class="info-grid">
        <div class="info-card placeholder">
          <span class="info-label">Address</span>
          <p class="info-value muted">Add address</p>
        </div>

        <div class="info-card placeholder">
          <span class="info-label">Est. Time to Complete</span>
          <p class="info-value muted">Add time</p>
        </div>

        <div class="info-card placeholder">
          <span class="info-label">Key</span>
          <p class="info-value muted">Add key info</p>
        </div>

        <div class="info-card alarm-code-card" data-alarm-code="Not set yet — add when this location is finalized" data-location-key="warehouse">
          <span class="info-label">Alarm</span>
          <button type="button" class="btn-alarm-reveal">Click for Alarm Code</button>
          <p class="info-value alarm-code-value" hidden aria-live="polite"></p>
        </div>
      </div>
    </section>

    <div class="modal-backdrop" id="alarmPinBackdrop" aria-hidden="true">
      <div class="modal alarm-pin-modal" role="dialog" aria-modal="true" aria-labelledby="alarmPinTitle">
        <h2 id="alarmPinTitle">Alarm code</h2>
        <p class="alarm-pin-hint">Enter the 4-digit code. It is checked automatically.</p>
        <label class="alarm-pin-label" for="alarmPinInput">4-digit code</label>
        <input
          type="password"
          inputmode="numeric"
          id="alarmPinInput"
          class="alarm-pin-input"
          maxlength="4"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        />
      </div>
    </div>
  </main>

  <script src="alarm-reveal.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.addEventListener('touchstart',function(){},{passive:true});</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="only light" />
  <meta name="supported-color-schemes" content="light" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ETM Checklist" />
  <title>Work log (ETM Checklist)</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/app-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <section class="log-page" data-work-log="true">
      <a class="back-link" href="index.html">&larr; Back to Home</a>

      <header class="loc-header">
        <p class="loc-eyebrow">Vehicle mileage + timer</p>
        <h1>Work Log</h1>
      </header>

      <div class="log-summary" id="workLogSummary"></div>

      <div class="log-table-wrap" id="workLogTableWrap" hidden>
        <table class="log-table work-log-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Started</th>
              <th>Ended</th>
              <th>Duration</th>
              <th>Start Mileage</th>
              <th>End Mileage</th>
              <th>Miles</th>
            </tr>
          </thead>
          <tbody id="workLogBody"></tbody>
        </table>
      </div>
      <div class="log-empty" id="workLogEmpty">
        <p>No work sessions logged yet.</p>
        <p class="muted-text">Use Start Work and End Work on the home page to add entries here.</p>
      </div>

      <div class="log-actions">
        <button type="button" class="btn-secondary" id="clearWorkLogBtn">Clear Work Log</button>
      </div>
    </section>
  </main>

  <script src="work-session.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.addEventListener('touchstart',function(){},{passive:true});document.addEventListener('gesturestart',function(e){e.preventDefault();});document.addEventListener('gesturechange',function(e){e.preventDefault();});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});var __etmLastTouchEnd=0;document.addEventListener('touchend',function(e){var now=Date.now();if(now-__etmLastTouchEnd<=300){e.preventDefault();}__etmLastTouchEnd=now;},{passive:false});</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="only light" />
  <meta name="supported-color-schemes" content="light" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ETM Checklist" />
  <title>Cleaning Calendar — ETM Checklist</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/app-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css?v=calendar-mode-menu-12" />
</head>
<body>
  <main class="calendar-page">
    <div class="home-dashboard-top home-dashboard-top--solo">
      <a class="back-link home-dashboard-log-link" href="index.html">&larr; Back to Locations</a>
    </div>
    <section class="calendar-shell">
      <header class="calendar-header">
        <button type="button" class="calendar-nav-btn" id="calendarPrevBtn" aria-label="Previous month">&larr;</button>
        <h1 id="calendarMonthLabel">Month Year</h1>
        <button type="button" class="calendar-nav-btn" id="calendarNextBtn" aria-label="Next month">&rarr;</button>
      </header>
      <div class="calendar-grid-wrap">
        <div class="calendar-weekdays" aria-hidden="true">
          <span>Su</span><span>M</span><span>T</span><span>W</span><span>Th</span><span>F</span><span>S</span>
        </div>
        <div class="calendar-grid" id="calendarGrid" role="grid" aria-label="Cleaning calendar month"></div>
      </div>
      <div class="calendar-mode-controls" id="calendarModeControls">
        <button type="button" class="btn-secondary calendar-mode-btn" id="calendarScheduleBtn">Schedule Cleanings</button>
        <button type="button" class="btn-secondary calendar-mode-btn" id="calendarEditBtn">Edit Cleanings</button>
        <button type="button" class="btn-secondary calendar-mode-btn" id="calendarDoneEditBtn">Done Editing</button>
        <button type="button" class="btn-secondary calendar-mode-btn" id="calendarDeleteBtn">Delete Cleanings</button>
      </div>
      <div class="calendar-delete-actions" id="calendarDeleteActions" hidden>
        <p class="calendar-delete-count" id="calendarDeleteCount">0 selected</p>
        <button type="button" class="btn-secondary calendar-edit-delete-btn" id="calendarDeleteSelectedBtn">Delete Selected</button>
      </div>
      <section class="calendar-add-panel" id="calendarAddPanel" aria-label="Add cleaning">
        <label class="calendar-add-label" for="calendarAddLocation">Location</label>
        <div class="calendar-add-row">
          <select id="calendarAddLocation" class="calendar-add-select" aria-label="Choose location for calendar add"></select>
          <select id="calendarAddTime" class="calendar-add-select" aria-label="Choose time for calendar add"></select>
          <button type="button" class="btn-secondary calendar-add-confirm" id="calendarAddConfirmBtn">Confirm selected dates</button>
        </div>
        <p class="calendar-add-hint" id="calendarAddHint">Choose a location and time, tap dates to stage, then confirm.</p>
      </section>
    </section>
  </main>

  <div id="calendarEditBackdrop" class="modal-backdrop" aria-hidden="true">
    <div class="modal calendar-edit-modal" role="dialog" aria-modal="true" aria-labelledby="calendarEditTitle">
      <h2 id="calendarEditTitle">Edit scheduled cleaning</h2>
      <p class="calendar-edit-sub" id="calendarEditSub"></p>
      <div class="calendar-edit-fields">
        <label class="calendar-edit-label" for="calendarEditDate">Date</label>
        <input type="date" id="calendarEditDate" class="calendar-edit-input" />
        <label class="calendar-edit-label" for="calendarEditTime">Time</label>
        <select id="calendarEditTime" class="calendar-edit-input" aria-label="Scheduled time"></select>
      </div>
      <div class="calendar-edit-actions">
        <button type="button" class="btn-primary" id="calendarEditSave">Save changes</button>
        <button type="button" class="btn-secondary calendar-edit-delete-btn" id="calendarEditDelete">Delete scheduled cleaning</button>
        <button type="button" class="btn-secondary" id="calendarEditCancel">Cancel</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var monthLabel = document.getElementById('calendarMonthLabel');
      var prevBtn = document.getElementById('calendarPrevBtn');
      var nextBtn = document.getElementById('calendarNextBtn');
      var grid = document.getElementById('calendarGrid');
      var addPanel = document.getElementById('calendarAddPanel');
      var addLocationSelect = document.getElementById('calendarAddLocation');
      var addTimeSelect = document.getElementById('calendarAddTime');
      var addConfirmBtn = document.getElementById('calendarAddConfirmBtn');
      var addHint = document.getElementById('calendarAddHint');
      var editBackdrop = document.getElementById('calendarEditBackdrop');
      var editSub = document.getElementById('calendarEditSub');
      var editDate = document.getElementById('calendarEditDate');
      var editTime = document.getElementById('calendarEditTime');
      var editSave = document.getElementById('calendarEditSave');
      var editDelete = document.getElementById('calendarEditDelete');
      var editCancel = document.getElementById('calendarEditCancel');
      var modeControls = document.getElementById('calendarModeControls');
      var scheduleBtn = document.getElementById('calendarScheduleBtn');
      var editBtn = document.getElementById('calendarEditBtn');
      var deleteBtn = document.getElementById('calendarDeleteBtn');
      var doneEditBtn = document.getElementById('calendarDoneEditBtn');
      var deleteActions = document.getElementById('calendarDeleteActions');
      var deleteCount = document.getElementById('calendarDeleteCount');
      var deleteSelectedBtn = document.getElementById('calendarDeleteSelectedBtn');
      if (
        !monthLabel ||
        !prevBtn ||
        !nextBtn ||
        !grid ||
        !addPanel ||
        !addLocationSelect ||
        !addTimeSelect ||
        !addConfirmBtn ||
        !addHint ||
        !editBackdrop ||
        !editSub ||
        !editDate ||
        !editTime ||
        !editSave ||
        !editDelete ||
        !editCancel ||
        !modeControls ||
        !scheduleBtn ||
        !editBtn ||
        !deleteBtn ||
        !doneEditBtn ||
        !deleteActions ||
        !deleteCount ||
        !deleteSelectedBtn
      ) {
        return;
      }

      var calendarEditContext = null;
      var calendarEditModeEnabled = false;
      var calendarMode = 'view';
      var selectedDeleteKeys = Object.create(null);

      var LOG_SUFFIX = ':log';
      var now = new Date();
      var todayKey = [now.getFullYear(), now.getMonth(), now.getDate()].join('-');
      var visible = new Date(now.getFullYear(), now.getMonth(), 1);
      var selectedSourceKey = '';
      var selectedLabel = '';
      var stagedDayMap = Object.create(null);
      var locationOptions = loadLocationsFromHome();

      function parseQuery() {
        try {
          return new URLSearchParams(window.location.search || '');
        } catch (e) {
          return new URLSearchParams('');
        }
      }

      function readLogArray(sourceKey) {
        try {
          var raw = localStorage.getItem(sourceKey + LOG_SUFFIX);
          if (!raw) return [];
          var parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      }

      function toDayKeyFromTs(ts) {
        var d = new Date(Number(ts));
        if (isNaN(d.getTime())) return '';
        return [d.getFullYear(), d.getMonth(), d.getDate()].join('-');
      }

      function loadLocationsFromHome() {
        var out = [];
        try {
          var parser = new DOMParser();
          var rawIndex = localStorage.getItem('etm-calendar-location-cache');
          if (rawIndex) {
            var cached = JSON.parse(rawIndex);
            if (Array.isArray(cached) && cached.length) return cached;
          }
          var links = document.querySelectorAll('a.location-btn[data-storage-key]');
          if (links.length) {
            links.forEach(function (link) {
              var key = link.dataset.storageKey || '';
              var labelEl = link.querySelector('.location-btn__title');
              var label = labelEl ? labelEl.textContent.trim() : '';
              if (key && label) out.push({ sourceKey: key, label: label });
            });
          }
          if (out.length) return out;
          if (window.fetch) {
            // Fallback for direct calendar loads: parse locations from home page.
            fetch('index.html', { cache: 'no-store' })
              .then(function (res) { return res.text(); })
              .then(function (html) {
                var doc = parser.parseFromString(html, 'text/html');
                var nodes = doc.querySelectorAll('.location-list .location-btn[data-storage-key]');
                var parsed = [];
                nodes.forEach(function (n) {
                  var key = n.getAttribute('data-storage-key') || '';
                  var title = n.querySelector('.location-btn__title');
                  var label = title ? title.textContent.trim() : '';
                  if (key && label) parsed.push({ sourceKey: key, label: label });
                });
                if (!parsed.length) return;
                locationOptions = parsed;
                localStorage.setItem('etm-calendar-location-cache', JSON.stringify(parsed));
                renderLocationPicker();
              })
              .catch(function () {});
          }
        } catch (e) {}
        return out;
      }

      function renderLocationPicker() {
        addLocationSelect.innerHTML = '';
        var ph = document.createElement('option');
        ph.value = '';
        ph.textContent = 'Select a location';
        addLocationSelect.appendChild(ph);
        locationOptions.forEach(function (loc) {
          var opt = document.createElement('option');
          opt.value = loc.sourceKey;
          opt.textContent = loc.label;
          opt.dataset.label = loc.label;
          addLocationSelect.appendChild(opt);
        });
        if (selectedSourceKey) {
          addLocationSelect.value = selectedSourceKey;
        }
      }

      function pad2(n) {
        return n < 10 ? '0' + n : '' + n;
      }

      function dayKeyToDateValue(dayKey) {
        var p = parseDayKey(dayKey);
        return p.y + '-' + pad2(p.m + 1) + '-' + pad2(p.d);
      }

      function populateHourTimeSelect(selectEl) {
        selectEl.innerHTML = '';
        var base = [
          { value: '00:00', label: '12:00 AM' },
          { value: '01:00', label: '1:00 AM' },
          { value: '02:00', label: '2:00 AM' },
          { value: '03:00', label: '3:00 AM' },
          { value: '04:00', label: '4:00 AM' },
          { value: '05:00', label: '5:00 AM' },
          { value: '06:00', label: '6:00 AM' },
          { value: '07:00', label: '7:00 AM' },
          { value: '08:00', label: '8:00 AM' },
          { value: '09:00', label: '9:00 AM' },
          { value: '10:00', label: '10:00 AM' },
          { value: '11:00', label: '11:00 AM' },
          { value: '12:00', label: '12:00 PM' },
          { value: '13:00', label: '1:00 PM' },
          { value: '14:00', label: '2:00 PM' },
          { value: '15:00', label: '3:00 PM' },
          { value: '16:00', label: '4:00 PM' },
          { value: '17:00', label: '5:00 PM' },
          { value: '18:00', label: '6:00 PM' },
          { value: '19:00', label: '7:00 PM' },
          { value: '20:00', label: '8:00 PM' },
          { value: '21:00', label: '9:00 PM' },
          { value: '22:00', label: '10:00 PM' },
          { value: '23:00', label: '11:00 PM' }
        ];
        base.forEach(function (t) {
          var opt = document.createElement('option');
          opt.value = t.value;
          opt.textContent = t.label;
          selectEl.appendChild(opt);
        });
      }

      function renderTimePicker() {
        populateHourTimeSelect(addTimeSelect);
        addTimeSelect.value = '12:00';
      }

      function collectDayCounts(year, month) {
        var counts = Object.create(null);
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i);
          if (!key || key.indexOf('checklist-') !== 0 || key.slice(-LOG_SUFFIX.length) !== LOG_SUFFIX) continue;
          var sourceKey = key.slice(0, -LOG_SUFFIX.length);
          var log = readLogArray(sourceKey);
          for (var j = 0; j < log.length; j++) {
            var dayKey = toDayKeyFromTs(log[j].completedAt);
            if (!dayKey) continue;
            var parts = dayKey.split('-');
            if (Number(parts[0]) !== year || Number(parts[1]) !== month) continue;
            counts[dayKey] = (counts[dayKey] || 0) + 1;
          }
        }
        return counts;
      }

      function locationLabelFromSourceKey(sourceKey) {
        for (var i = 0; i < locationOptions.length; i++) {
          if (locationOptions[i].sourceKey === sourceKey) return locationOptions[i].label;
        }
        var m = String(sourceKey || '').match(/^checklist-(.+)$/);
        return m ? m[1].replace(/-/g, ' ') : (sourceKey || 'Location');
      }

      function formatTimeForDay(ts) {
        var d = new Date(Number(ts));
        if (isNaN(d.getTime())) return '';
        var s = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        return String(s).replace(/\s+/g, '');
      }

      function locationMenuHrefFromSourceKey(sourceKey) {
        var slug = String(sourceKey || '').replace(/^checklist-/, '');
        return slug ? slug + '.html' : 'index.html';
      }

      function locationLogHrefFromSourceKey(sourceKey) {
        var slug = String(sourceKey || '').replace(/^checklist-/, '');
        return slug ? slug + '-log.html' : 'index.html';
      }

      function hasChecklistCompletionOnDay(sourceKey, dayKey) {
        if (!sourceKey || !dayKey) return false;
        var log = readLogArray(sourceKey);
        for (var i = 0; i < log.length; i++) {
          if (toDayKeyFromTs(log[i].completedAt) !== dayKey) continue;
          return true;
        }
        return false;
      }

      function cleanupCalendarPlaceholdersCoveredByRealCompletions() {
        var touched = false;
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i);
          if (!key || key.indexOf('checklist-') !== 0 || key.slice(-LOG_SUFFIX.length) !== LOG_SUFFIX) continue;
          var sourceKey = key.slice(0, -LOG_SUFFIX.length);
          var log = readLogArray(sourceKey);
          if (!log.length) continue;

          var hasRealByDay = Object.create(null);
          for (var j = 0; j < log.length; j++) {
            var dayKey = toDayKeyFromTs(log[j].completedAt);
            if (!dayKey) continue;
            if (!log[j].addedFromCalendar) hasRealByDay[dayKey] = true;
          }

          var changed = false;
          var next = [];
          for (var k = 0; k < log.length; k++) {
            var entry = log[k];
            var entryDayKey = toDayKeyFromTs(entry.completedAt);
            if (entryDayKey && entry.addedFromCalendar && hasRealByDay[entryDayKey]) {
              changed = true;
              continue;
            }
            next.push(entry);
          }
          if (changed) {
            touched = true;
            localStorage.setItem(sourceKey + LOG_SUFFIX, JSON.stringify(next));
          }
        }
        return touched;
      }

      function collectDaySchedules(year, month) {
        var schedules = Object.create(null);
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i);
          if (!key || key.indexOf('checklist-') !== 0 || key.slice(-LOG_SUFFIX.length) !== LOG_SUFFIX) continue;
          var sourceKey = key.slice(0, -LOG_SUFFIX.length);
          var log = readLogArray(sourceKey);
          for (var j = 0; j < log.length; j++) {
            var completedAt = Number(log[j].completedAt);
            if (!completedAt) continue;
            var d = new Date(completedAt);
            if (isNaN(d.getTime())) continue;
            if (d.getFullYear() !== year || d.getMonth() !== month) continue;
            var dayKey = [d.getFullYear(), d.getMonth(), d.getDate()].join('-');
            if (!schedules[dayKey]) schedules[dayKey] = [];
            schedules[dayKey].push({
              minutes: d.getHours() * 60 + d.getMinutes(),
              timeLabel: formatTimeForDay(completedAt),
              locationLabel: locationLabelFromSourceKey(sourceKey),
              sourceKey: sourceKey,
              completedAt: completedAt,
              addedFromCalendar: !!log[j].addedFromCalendar
            });
          }
        }
        Object.keys(schedules).forEach(function (dayKey) {
          schedules[dayKey].sort(function (a, b) {
            if (a.minutes !== b.minutes) return a.minutes - b.minutes;
            return String(a.locationLabel).localeCompare(String(b.locationLabel));
          });
        });
        return schedules;
      }

      function dayHasLogEntry(sourceKey, dayKey) {
        if (!sourceKey || !dayKey) return false;
        var log = readLogArray(sourceKey);
        for (var i = 0; i < log.length; i++) {
          if (toDayKeyFromTs(log[i].completedAt) === dayKey) return true;
        }
        return false;
      }

      function setAddHint(msg) {
        addHint.textContent = msg;
      }

      function getSelectedTime() {
        var raw = addTimeSelect.value || '12:00';
        var parts = raw.split(':');
        return {
          h: Number(parts[0]) || 0,
          m: Number(parts[1]) || 0
        };
      }

      function parseDayKey(dayKey) {
        var bits = String(dayKey || '').split('-');
        return {
          y: Number(bits[0]) || 0,
          m: Number(bits[1]) || 0,
          d: Number(bits[2]) || 0
        };
      }

      function toTimestamp(dayKey, hm) {
        var p = parseDayKey(dayKey);
        return new Date(p.y, p.m, p.d, hm.h, hm.m, 0, 0).getTime();
      }

      function rowDeleteKey(sourceKey, completedAt) {
        return String(sourceKey || '') + '|' + String(Number(completedAt) || 0);
      }

      function updateDeleteActionUi() {
        var keys = Object.keys(selectedDeleteKeys).filter(function (k) { return selectedDeleteKeys[k]; });
        deleteCount.textContent = keys.length + ' selected';
        deleteSelectedBtn.disabled = keys.length === 0;
      }

      function getSelectedDays() {
        return Object.keys(stagedDayMap).filter(function (k) { return stagedDayMap[k]; }).sort();
      }

      function refreshConfirmState() {
        var count = getSelectedDays().length;
        addConfirmBtn.disabled = !selectedSourceKey || count === 0;
        addConfirmBtn.textContent = count > 0 ? 'Confirm ' + count + ' selected date' + (count === 1 ? '' : 's') : 'Confirm selected dates';
      }

      function clearStagedDays() {
        stagedDayMap = Object.create(null);
        refreshConfirmState();
      }

      function toggleStagedDay(dayKey) {
        if (!selectedSourceKey) {
          setAddHint('Choose a location first, then tap dates to stage them.');
          return;
        }
        stagedDayMap[dayKey] = !stagedDayMap[dayKey];
        var count = getSelectedDays().length;
        setAddHint(
          count > 0
            ? (count + ' date' + (count === 1 ? '' : 's') + ' selected for ' + selectedLabel + '. Press confirm to save.')
            : ('No dates selected. Tap dates for ' + selectedLabel + ', then confirm.')
        );
        refreshConfirmState();
        renderCalendar();
      }

      function closeCalendarEditModal() {
        calendarEditContext = null;
        editBackdrop.classList.remove('is-open');
        editBackdrop.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      function openCalendarEditModal(ctx) {
        calendarEditContext = ctx;
        editSub.textContent = ctx.locationLabel || '';
        if (!editTime.options.length) {
          populateHourTimeSelect(editTime);
        }
        editDate.value = dayKeyToDateValue(ctx.dayKey);
        var d = new Date(Number(ctx.completedAt));
        if (!isNaN(d.getTime())) {
          editTime.value = pad2(d.getHours()) + ':00';
        }
        editBackdrop.classList.add('is-open');
        editBackdrop.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        editDate.focus();
      }

      function syncModeUi() {
        if (calendarMode === 'view') modeControls.classList.remove('is-editing-any');
        else modeControls.classList.add('is-editing-any');
        if (calendarMode === 'edit') {
          modeControls.classList.add('is-editing');
          modeControls.classList.remove('is-deleting');
          editBtn.classList.add('is-active');
          scheduleBtn.classList.remove('is-active');
          deleteBtn.classList.remove('is-active');
        } else if (calendarMode === 'schedule') {
          modeControls.classList.remove('is-editing');
          modeControls.classList.remove('is-deleting');
          scheduleBtn.classList.add('is-active');
          editBtn.classList.remove('is-active');
          deleteBtn.classList.remove('is-active');
        } else if (calendarMode === 'delete') {
          modeControls.classList.remove('is-editing');
          modeControls.classList.add('is-deleting');
          scheduleBtn.classList.remove('is-active');
          editBtn.classList.remove('is-active');
          deleteBtn.classList.add('is-active');
        } else {
          modeControls.classList.remove('is-editing');
          modeControls.classList.remove('is-deleting');
          scheduleBtn.classList.remove('is-active');
          editBtn.classList.remove('is-active');
          deleteBtn.classList.remove('is-active');
        }
        deleteActions.hidden = calendarMode !== 'delete';
        doneEditBtn.hidden = calendarMode === 'view';
        updateDeleteActionUi();
      }

      function setViewMode() {
        calendarMode = 'view';
        calendarEditModeEnabled = false;
        addPanel.hidden = true;
        clearStagedDays();
        selectedDeleteKeys = Object.create(null);
        closeCalendarEditModal();
        syncModeUi();
        renderCalendar();
      }

      function setScheduleMode() {
        calendarMode = 'schedule';
        calendarEditModeEnabled = false;
        addPanel.hidden = false;
        selectedDeleteKeys = Object.create(null);
        closeCalendarEditModal();
        syncModeUi();
        renderCalendar();
      }

      function setEditMode() {
        calendarMode = 'edit';
        calendarEditModeEnabled = true;
        addPanel.hidden = true;
        clearStagedDays();
        selectedDeleteKeys = Object.create(null);
        closeCalendarEditModal();
        syncModeUi();
        renderCalendar();
      }

      function setDeleteMode() {
        calendarMode = 'delete';
        calendarEditModeEnabled = false;
        addPanel.hidden = true;
        clearStagedDays();
        selectedDeleteKeys = Object.create(null);
        closeCalendarEditModal();
        syncModeUi();
        renderCalendar();
      }

      scheduleBtn.addEventListener('click', function () {
        setScheduleMode();
      });
      editBtn.addEventListener('click', function () {
        setEditMode();
      });
      deleteBtn.addEventListener('click', function () {
        setDeleteMode();
      });
      doneEditBtn.addEventListener('click', function () {
        setViewMode();
      });

      function dayCell(dayNumber, isMuted, isToday, dayKey, dayCount, scheduleItems) {
        var cell = document.createElement('div');
        cell.className = 'calendar-day';
        if (isMuted) cell.classList.add('is-muted');
        if (isToday) cell.classList.add('is-today');
        if (selectedSourceKey && dayKey && dayHasLogEntry(selectedSourceKey, dayKey)) {
          cell.classList.add('has-cleaning-for-location');
        }
        if (dayKey && stagedDayMap[dayKey]) {
          cell.classList.add('is-staged-for-add');
        }
        cell.setAttribute('role', 'gridcell');
        var num = document.createElement('span');
        num.className = 'calendar-day-num';
        num.textContent = String(dayNumber);
        cell.appendChild(num);
        if (!isMuted && dayCount > 0) {
          var badge = document.createElement('span');
          badge.className = 'calendar-day-count';
          badge.textContent = String(dayCount);
          badge.setAttribute('aria-label', String(dayCount) + ' cleanings');
          cell.appendChild(badge);
        }
        if (!isMuted && Array.isArray(scheduleItems) && scheduleItems.length) {
          var schedule = document.createElement('div');
          schedule.className = 'calendar-day-schedule';
          for (var i = 0; i < scheduleItems.length; i++) {
            var item = scheduleItems[i];
            var done = hasChecklistCompletionOnDay(item.sourceKey, dayKey);
            var row = document.createElement('a');
            row.className =
              'calendar-day-schedule-row' +
              (done ? ' calendar-day-schedule-row--done' : ' calendar-day-schedule-row--pending');
            row.href = done
              ? locationLogHrefFromSourceKey(item.sourceKey)
              : locationMenuHrefFromSourceKey(item.sourceKey);
            var time = document.createElement('span');
            time.className = 'calendar-day-schedule-time';
            time.textContent = item.timeLabel;
            var loc = document.createElement('span');
            loc.className = 'calendar-day-schedule-location';
            loc.textContent = item.locationLabel;
            var fullLine = item.timeLabel + ' ' + item.locationLabel;
            row.title = fullLine + (done ? ' — open cleaning log' : ' — open location (not completed this day)');
            row.setAttribute(
              'aria-label',
              fullLine +
                (done ? ', open cleaning log for this location' : ', open location to complete checklist')
            );
            row.dataset.editable = item.addedFromCalendar ? '1' : '0';
            row.dataset.deletable = item.addedFromCalendar && !done ? '1' : '0';
            row.dataset.dayKey = dayKey;
            row.dataset.sourceKey = item.sourceKey;
            row.dataset.completedAt = String(item.completedAt || 0);
            row.dataset.locationLabel = item.locationLabel;
            if (calendarMode === 'delete' && row.dataset.deletable !== '1') {
              row.classList.add('calendar-day-schedule-row--delete-locked');
              row.title = fullLine + ' — completed cleanings can only be deleted in the cleaning log';
              row.setAttribute(
                'aria-label',
                fullLine + ', completed cleaning (delete in cleaning log only)'
              );
            }
            if (selectedDeleteKeys[rowDeleteKey(item.sourceKey, item.completedAt)]) {
              row.classList.add('calendar-day-schedule-row--selected-delete');
            }
            row.appendChild(time);
            row.appendChild(loc);
            schedule.appendChild(row);
          }
          cell.appendChild(schedule);
        }
        if (!isMuted && dayKey) {
          cell.tabIndex = 0;
          cell.dataset.dayKey = dayKey;
        }
        return cell;
      }

      function renderCalendar() {
        monthLabel.textContent = visible.toLocaleDateString('en-US', {
          month: 'long',
          year: 'numeric'
        });

        grid.innerHTML = '';
        var year = visible.getFullYear();
        var month = visible.getMonth();
        var firstWeekday = new Date(year, month, 1).getDay();
        var daysInMonth = new Date(year, month + 1, 0).getDate();
        var daysInPrevMonth = new Date(year, month, 0).getDate();
        var dayCounts = collectDayCounts(year, month);
        var daySchedules = collectDaySchedules(year, month);

        for (var i = firstWeekday - 1; i >= 0; i--) {
          grid.appendChild(dayCell(daysInPrevMonth - i, true, false, '', 0, []));
        }

        for (var d = 1; d <= daysInMonth; d++) {
          var key = [year, month, d].join('-');
          grid.appendChild(dayCell(d, false, key === todayKey, key, dayCounts[key] || 0, daySchedules[key] || []));
        }

        var totalCells = grid.children.length;
        var trailing = (7 - (totalCells % 7)) % 7;
        for (var t = 1; t <= trailing; t++) {
          grid.appendChild(dayCell(t, true, false, '', 0, []));
        }
      }

      prevBtn.addEventListener('click', function () {
        visible = new Date(visible.getFullYear(), visible.getMonth() - 1, 1);
        renderCalendar();
      });
      nextBtn.addEventListener('click', function () {
        visible = new Date(visible.getFullYear(), visible.getMonth() + 1, 1);
        renderCalendar();
      });
      addLocationSelect.addEventListener('change', function () {
        var opt = addLocationSelect.options[addLocationSelect.selectedIndex];
        selectedSourceKey = opt && opt.value ? opt.value : '';
        selectedLabel = opt ? (opt.dataset.label || opt.textContent || '') : '';
        clearStagedDays();
        if (selectedSourceKey) {
          setAddHint('Tap dates for ' + selectedLabel + ', then press confirm.');
        } else {
          setAddHint('Choose a location first, then tap dates to stage them.');
        }
        refreshConfirmState();
        renderCalendar();
      });
      grid.addEventListener('click', function (evt) {
        var link = evt.target.closest('a.calendar-day-schedule-row');
        if (link) {
          if (calendarMode === 'delete') {
            evt.preventDefault();
            if (link.dataset.deletable !== '1') return;
            var key = rowDeleteKey(link.dataset.sourceKey, link.dataset.completedAt);
            selectedDeleteKeys[key] = !selectedDeleteKeys[key];
            updateDeleteActionUi();
            renderCalendar();
            return;
          }
          if (calendarEditModeEnabled && link.dataset.editable === '1') {
            evt.preventDefault();
            openCalendarEditModal({
              sourceKey: link.dataset.sourceKey,
              completedAt: link.dataset.completedAt,
              dayKey: link.dataset.dayKey,
              locationLabel: link.dataset.locationLabel
            });
          }
          return;
        }
        if (addPanel.hidden) return;
        var cell = evt.target.closest('.calendar-day[data-day-key]');
        if (!cell) return;
        toggleStagedDay(cell.dataset.dayKey);
      });
      deleteSelectedBtn.addEventListener('click', function () {
        var keys = Object.keys(selectedDeleteKeys).filter(function (k) { return selectedDeleteKeys[k]; });
        if (!keys.length) return;
        var grouped = Object.create(null);
        keys.forEach(function (k) {
          var parts = k.split('|');
          var sk = parts[0];
          var ts = Number(parts[1]) || 0;
          if (!grouped[sk]) grouped[sk] = Object.create(null);
          grouped[sk][ts] = true;
        });
        Object.keys(grouped).forEach(function (sk) {
          var log = readLogArray(sk);
          var next = log.filter(function (e) {
            return !grouped[sk][Number(e.completedAt) || 0];
          });
          localStorage.setItem(sk + LOG_SUFFIX, JSON.stringify(next));
          if (window.EtmMediaDB) {
            Object.keys(grouped[sk]).forEach(function (ts) {
              window.EtmMediaDB.deleteLogPhotos(sk, Number(ts)).catch(function () {});
            });
          }
        });
        selectedDeleteKeys = Object.create(null);
        updateDeleteActionUi();
        renderCalendar();
      });
      grid.addEventListener('keydown', function (evt) {
        if (evt.key !== 'Enter' && evt.key !== ' ') return;
        var link = evt.target.closest && evt.target.closest('a.calendar-day-schedule-row');
        if (link) {
          if (calendarEditModeEnabled && link.dataset.editable === '1') {
            evt.preventDefault();
            openCalendarEditModal({
              sourceKey: link.dataset.sourceKey,
              completedAt: link.dataset.completedAt,
              dayKey: link.dataset.dayKey,
              locationLabel: link.dataset.locationLabel
            });
          }
          return;
        }
        if (addPanel.hidden) return;
        var cell = evt.target.closest('.calendar-day[data-day-key]');
        if (!cell) return;
        evt.preventDefault();
        toggleStagedDay(cell.dataset.dayKey);
      });
      addConfirmBtn.addEventListener('click', function () {
        if (!selectedSourceKey) {
          setAddHint('Choose a location first.');
          return;
        }
        var selectedDays = getSelectedDays();
        if (!selectedDays.length) {
          setAddHint('Select at least one date before confirming.');
          return;
        }
        var hm = getSelectedTime();
        var log = readLogArray(selectedSourceKey);
        var created = 0;
        var skipped = 0;
        selectedDays.forEach(function (dayKey) {
          var completedAt = toTimestamp(dayKey, hm);
          var exists = false;
          for (var i = 0; i < log.length; i++) {
            if (Number(log[i].completedAt) === completedAt) {
              exists = true;
              break;
            }
          }
          if (exists) {
            skipped++;
            return;
          }
          var startedAt = Math.max(0, completedAt - 60 * 60 * 1000);
          log.push({
            sessionStart: startedAt,
            completedAt: completedAt,
            elapsedMs: completedAt - startedAt,
            tasks: [],
            notesCurrent: '',
            notesForNext: '',
            addedFromCalendar: true
          });
          created++;
        });
        log.sort(function (a, b) {
          return Number(b.completedAt || 0) - Number(a.completedAt || 0);
        });
        localStorage.setItem(selectedSourceKey + LOG_SUFFIX, JSON.stringify(log));
        clearStagedDays();
        setAddHint(
          'Saved ' + created + ' cleaning' + (created === 1 ? '' : 's') +
          ' for ' + selectedLabel + (skipped ? ' (' + skipped + ' skipped as duplicates).' : '.')
        );
        renderCalendar();
      });

      editCancel.addEventListener('click', closeCalendarEditModal);
      editBackdrop.addEventListener('click', function (evt) {
        if (evt.target === editBackdrop) closeCalendarEditModal();
      });
      editSave.addEventListener('click', function () {
        if (!calendarEditContext) return;
        var dayVal = editDate.value;
        if (!dayVal) {
          alert('Pick a date.');
          return;
        }
        var ymd = dayVal.split('-');
        var newDayKey = [Number(ymd[0]), Number(ymd[1]) - 1, Number(ymd[2])].join('-');
        var timeVal = editTime.value || '12:00';
        var tp = timeVal.split(':');
        var hm = { h: Number(tp[0]) || 0, m: Number(tp[1]) || 0 };
        var newTs = toTimestamp(newDayKey, hm);
        var sk = calendarEditContext.sourceKey;
        var oldTs = Number(calendarEditContext.completedAt);
        var log = readLogArray(sk);
        var idx = log.findIndex(function (e) {
          return Number(e.completedAt) === oldTs && e.addedFromCalendar;
        });
        if (idx === -1) {
          closeCalendarEditModal();
          renderCalendar();
          return;
        }
        for (var c = 0; c < log.length; c++) {
          if (c !== idx && Number(log[c].completedAt) === newTs) {
            alert('That date and time is already used for this location.');
            return;
          }
        }
        var nextLog = log.filter(function (e, j) {
          return j === idx || Number(e.completedAt) !== newTs;
        });
        var newIdx = nextLog.findIndex(function (e) {
          return Number(e.completedAt) === oldTs && e.addedFromCalendar;
        });
        if (newIdx === -1) return;
        var entry = nextLog[newIdx];
        var startedAt = Math.max(0, newTs - 60 * 60 * 1000);
        nextLog[newIdx] = Object.assign({}, entry, {
          sessionStart: startedAt,
          completedAt: newTs,
          elapsedMs: newTs - startedAt
        });
        nextLog.sort(function (a, b) {
          return Number(b.completedAt || 0) - Number(a.completedAt || 0);
        });
        localStorage.setItem(sk + LOG_SUFFIX, JSON.stringify(nextLog));
        closeCalendarEditModal();
        renderCalendar();
      });
      editDelete.addEventListener('click', function () {
        if (!calendarEditContext) return;
        var sk = calendarEditContext.sourceKey;
        var oldTs = Number(calendarEditContext.completedAt);
        var log = readLogArray(sk);
        var next = log.filter(function (e) {
          return !(Number(e.completedAt) === oldTs && e.addedFromCalendar);
        });
        if (next.length === log.length) {
          closeCalendarEditModal();
          renderCalendar();
          return;
        }
        localStorage.setItem(sk + LOG_SUFFIX, JSON.stringify(next));
        if (window.EtmMediaDB) {
          window.EtmMediaDB.deleteLogPhotos(sk, oldTs).catch(function () {});
        }
        closeCalendarEditModal();
        renderCalendar();
      });
      document.addEventListener('keydown', function (evt) {
        if (evt.key !== 'Escape') return;
        if (editBackdrop.classList.contains('is-open')) {
          closeCalendarEditModal();
        }
      });

      (function initFromQuery() {
        cleanupCalendarPlaceholdersCoveredByRealCompletions();
        var params = parseQuery();
        selectedSourceKey = params.get('sourceKey') || '';
        selectedLabel = params.get('label') || '';
        renderLocationPicker();
        if (selectedSourceKey && selectedLabel) {
          var found = false;
          for (var i = 0; i < locationOptions.length; i++) {
            if (locationOptions[i].sourceKey === selectedSourceKey) {
              found = true;
              break;
            }
          }
          if (!found) {
            locationOptions.push({ sourceKey: selectedSourceKey, label: selectedLabel });
            renderLocationPicker();
          }
          addLocationSelect.value = selectedSourceKey;
          setAddHint('Tap dates for ' + selectedLabel + ', then press confirm.');
        } else {
          setAddHint('Choose a location first, then tap dates to stage them.');
        }
      })();

      renderTimePicker();
      populateHourTimeSelect(editTime);
      refreshConfirmState();
      setViewMode();
      renderCalendar();
      window.addEventListener('pageshow', function () {
        renderCalendar();
      });
    })();
  </script>
  <script src="app.js"></script>
</body>
</html>
